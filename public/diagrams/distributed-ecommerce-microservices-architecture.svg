<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">客服与交易各自负责什么</title><desc id="desc">客服链路不是模型自主多工具循环。SSE 将完成后的文本分块发送，不能标注为模型 token 原生流式输出。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#a34b66"/></marker></defs><rect width="1000" height="540" rx="24" fill="#fff8f5"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#452f3a"><text x="38" y="48" font-size="23" font-weight="600">客服与交易各自负责什么</text><text x="38" y="78" font-size="12" fill="#936776">SYSTEM ATLAS / 2026.09 · READ THE BOUNDARIES BELOW</text><path d="M310 179 H365" fill="none" stroke="#bd8093" stroke-width="1.6" marker-end="url(#arrow)"/><text x="337.5" y="168" text-anchor="middle" font-size="12" fill="#874b60">咨询</text><path d="M635 179 H690" fill="none" stroke="#bd8093" stroke-width="1.6" marker-end="url(#arrow)"/><text x="662.5" y="168" text-anchor="middle" font-size="12" fill="#874b60">回答</text><path d="M175 228 V299.0 H175 V370" fill="none" stroke="#bd8093" stroke-width="1.6" marker-end="url(#arrow)"/><text x="175.0" y="290.0" text-anchor="middle" font-size="12" fill="#874b60">购买</text><path d="M310 419 H365" fill="none" stroke="#bd8093" stroke-width="1.6" marker-end="url(#arrow)"/><text x="337.5" y="408" text-anchor="middle" font-size="12" fill="#874b60">完成结算</text><path d="M635 419 H690" fill="none" stroke="#bd8093" stroke-width="1.6" marker-end="url(#arrow)"/><text x="662.5" y="408" text-anchor="middle" font-size="12" fill="#874b60">事件</text><rect x="40" y="130" width="270" height="98" rx="15" fill="#fffdfb" stroke="#dfbec9"/><text x="58" y="164" font-size="18" font-weight="600">用户会话</text><text x="58" y="195" font-size="13" fill="#805c6a">咨询或购买意图</text><rect x="365" y="130" width="270" height="98" rx="15" fill="#fffdfb" stroke="#dfbec9"/><text x="383" y="164" font-size="18" font-weight="600">规则路由</text>