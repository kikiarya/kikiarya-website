<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">租约过期后的旧 Worker 风险</title><desc id="desc">当前边界：重新领取不等于旧 Worker 已停止。完成写入应有执行代次围栏；本图最后一步是改进建议，不是现有保证。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#a34b66"/></marker></defs><rect width="1000" height="650" rx="24" fill="#fff8f5"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#452f3a"><text x="38" y="48" font-size="23" font-weight="600">租约过期后的旧 Worker 风险</text><text x="38" y="78" font-size="12" fill="#936776">SYSTEM ATLAS / 2026.09 · READ THE BOUNDARIES BELOW</text><rect x="50" y="104" width="240" height="54" rx="12" fill="#f3dce3"/><text x="170" y="138" text-anchor="middle" font-size="18">Worker A</text><path d="M170 170 V610" stroke="#d6b5c0" stroke-dasharray="5 7"/><rect x="380" y="104" width="240" height="54" rx="12" fill="#f3dce3"/><text x="500" y="138" text-anchor="middle" font-size="18">Run 存储</text><path d="M500 170 V610" stroke="#d6b5c0" stroke-dasharray="5 7"/><rect x="710" y="104" width="240" height="54" rx="12" fill="#f3dce3"/><text x="830" y="138" text-anchor="middle" font-size="18">Worker B</text><path d="M830 170 V610" stroke="#d6b5c0" stroke-dasharray="5 7"/><path d="M170 213 H500" fill="none" stroke="#a34b66" stroke-width="1.7" marker-end="url(#arrow)"/><text x="335.0" y="201" text-anchor="middle" font-size="14">1. 领取并开始执行</text><path d="M500 279 H830" fill="none" stroke="#a34b66" stroke-width="1.7" marker-end="url(#arrow)"/><text x="665.0" y="267" text-anchor="middle" font-size="14">2. 租约过期，重新领取</text><path d="M170 345 H500" fill="none" stroke="#a34b66" stroke-width="1.7" marker-end="url(#arrow)"/><text x="335.0" y="333" text-anchor="middle" font-size="14">3. 迟到的完成写入</text><path d="M500 411 h65 v24 h-65" fill="none" stroke="#a34b66" stroke-width="1.7" marker-end="url(#arrow)"/><text x="565" y="399" tex