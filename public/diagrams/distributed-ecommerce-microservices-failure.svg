<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">支付 UNKNOWN 与异步消息</title><desc id="desc">UNKNOWN 不等于失败，不应直接补库存。Outbox 存在确认后、标记前崩溃的重投窗口；另外 Checkout 外层事务可能覆盖银行调用，不能声称网络调用已在物理事务外。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#a34b66"/></marker></defs><rect width="1000" height="650" rx="24" fill="#fff8f5"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#452f3a"><text x="38" y="48" font-size="23" font-weight="600">支付 UNKNOWN 与异步消息</text><text x="38" y="78" font-size="12" fill="#936776">SYSTEM ATLAS / 2026.09 · READ THE BOUNDARIES BELOW</text><rect x="50" y="104" width="240" height="54" rx="12" fill="#f3dce3"/><text x="170" y="138" text-anchor="middle" font-size="18">订单服务</text><path d="M170 170 V610" stroke="#d6b5c0" stroke-dasharray="5 7"/><rect x="380" y="104" width="240" height="54" rx="12" fill="#f3dce3"/><text x="500" y="138" text-anchor="middle" font-size="18">银行</text><path d="M500 170 V610" stroke="#d6b5c0" stroke-dasharray="5 7"/><rect x="710" y="104" width="240" height="54" rx="12" fill="#f3dce3"/><text x="830" y="138" text-anchor="middle" font-size="18">Outbox</text><path d="M830 170 V610" stroke="#d6b5c0" stroke-dasharray="5 7"/><path d="M170 213 H500" fill="none" stroke="#a34b66" stroke-width="1.7" marker-end="url(#arrow)"/><text x="335.0" y="201" text-anchor="middle" font-size="14">1. 发起支付或查询</text><path d="M500 279 H170" fill="none" stroke="#a34b66" stroke-width="1.7" marker-end="url(#arrow)"/><text x="335.0" y="267" text-anchor="middle" font-size="14">2. 结果未知 UNKNOWN</text><path d="M170 345 h65 v24 h-65" fill="none" stroke="#a34b66" stroke-width="1.7" marker-end="url(#arrow)"/><text x="235" y="333" text-anchor="end" font-size="14">3. 保留待确认，后续对账</text><path d="M500 411 H170" fill="none" stroke="#a34b66" stroke-width="1.7" marker-end="url(#arrow)"/><text x="335.0" y="399" text-anchor="middle" font-size="14">4. 确认成功</text><path d="M170 477 H830" fill="none" stroke="#a34b66" stroke-width="1.7" marker-end="url(#arrow)"/><text x="500.0" y="465" text-anchor="middle" font-size="14">5. 写入订单事件</text><path d="M830 543 h65 v24 h-65" fill="none" stroke="#a34b66" stroke-width="1.7" marker-end="url(#arrow)"/><text x="895" y="531" text-anchor="end" font-size="14">6. 发布确认后标记 sentAt</text></g></svg>